name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cabinet-planner/package-lock.json

      - name: Install dependencies
        working-directory: cabinet-planner
        run: npm ci

      # The same gates ci.yml runs on pull requests. CI only guards PRs, so
      # without these a push straight to main would publish unverified. They are
      # separate steps rather than one `npm test` so a failure names itself in
      # the Actions UI.
      - name: Lint
        working-directory: cabinet-planner
        run: npm run lint

      - name: Validate catalogs
        working-directory: cabinet-planner
        run: npm run validate

      - name: Golden output test
        working-directory: cabinet-planner
        run: npm run test:golden

      - name: Build
        working-directory: cabinet-planner
        run: npm run build

      - name: Check bundle size
        working-directory: cabinet-planner
        run: npm run check:size

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: cabinet-planner/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
